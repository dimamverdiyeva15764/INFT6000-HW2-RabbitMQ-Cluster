# SELFTEST ONLY: fake clients, short runs, no RabbitMQ. Output: benchmarks/results/selftest/
defaults:
  hosts: "localhost:5672,localhost:5673,localhost:5674"
  queue: hw2.orders
  duration: 8
  warmup: 2
  repeats: 2
  rate: 0
  size: 1024
  producer_threads: 4
  consumer_threads: 4
  prefetch: 100
  consumer_start_delay: 1
  drain_timeout: 5
  cooldown: 0
commands:
  producer: python3 benchmarks/selftest/fake_producer.py --hosts {hosts} --queue {queue} --threads {producer_threads} --duration {duration} --rate {rate} --size {size} --out {out}
  consumer: python3 benchmarks/selftest/fake_consumer.py --hosts {hosts} --queue {queue} --threads {consumer_threads} --prefetch {prefetch} --out {out}
scenarios:
  - {id: B1-baseline, group: B1, producer_threads: 1, consumer_threads: 1}
  - {id: B2-p1, group: B2, producer_threads: 1}
  - {id: B2-p4, group: B2, producer_threads: 4}
  - {id: B4-q10, group: B4, prefetch: 10}
  - {id: B4-q500, group: B4, prefetch: 500}
