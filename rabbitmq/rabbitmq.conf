# ---------------------------------------------------------------
# RabbitMQ node configuration (shared by rabbit1, rabbit2, rabbit3)
# ---------------------------------------------------------------

# --- Cluster formation: static list of peers (classic_config) ---
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2
cluster_formation.classic_config.nodes.3 = rabbit@rabbit3

# --- Network partition policy ---
# pause_minority: a node that sees fewer than half of the cluster pauses itself.
# Quorum queues (Raft) additionally require a majority (2 of 3) to commit writes.
cluster_partition_handling = pause_minority

# --- Raft / quorum queue defaults ---
# Quorum queues are created by clients with x-queue-type=quorum.
# A 3-member Raft group tolerates the loss of 1 node (majority = 2).
quorum_queue.continuous_membership_reconciliation.enabled = true
quorum_queue.continuous_membership_reconciliation.target_group_size = 3

# --- Memory / disk safety limits ---
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# --- Listeners ---
listeners.tcp.default = 5672
management.tcp.port = 15672
prometheus.tcp.port = 15692

# --- Heartbeat (detect dead peers/clients quickly) ---
heartbeat = 10

# --- Logging ---
log.console = true
log.console.level = info
