# Unit tests for the alert rules (owner: P2).
# Run:  docker run --rm -v "$PWD/monitoring/prometheus:/p" --entrypoint promtool \
#         prom/prometheus:v2.53.0 test rules /p/tests/rabbitmq-alerts.test.yml
rule_files:
  - ../rules/rabbitmq-alerts.yml

evaluation_interval: 5s

tests:
  # 1. One node killed (follower crash / leader crash): NodeDown fires, quorum NOT lost.
  - interval: 5s
    input_series:
      - series: 'up{job="rabbitmq",instance="rabbit1:15692"}'
        values: "1 1 1 1 1 1 1 1"
      - series: 'up{job="rabbitmq",instance="rabbit2:15692"}'
        values: "1 1 0 0 0 0 0 0"
      - series: 'up{job="rabbitmq",instance="rabbit3:15692"}'
        values: "1 1 1 1 1 1 1 1"
    alert_rule_test:
      - eval_time: 30s
        alertname: RabbitMQNodeDown
        exp_alerts:
          - exp_labels: {severity: critical, job: rabbitmq, instance: "rabbit2:15692"}
            exp_annotations:
              summary: "RabbitMQ node rabbit2:15692 is down"
              description: "Prometheus cannot scrape rabbit2:15692. The quorum queue keeps working while 2 of 3 nodes are up."
      - eval_time: 30s
        alertname: RabbitMQQuorumLost
        exp_alerts: []

  # 2. Two nodes down: majority lost.
  - interval: 5s
    input_series:
      - series: 'up{job="rabbitmq",instance="rabbit1:15692"}'
        values: "1 0 0 0 0 0"
      - series: 'up{job="rabbitmq",instance="rabbit2:15692"}'
        values: "1 0 0 0 0 0"
      - series: 'up{job="rabbitmq",instance="rabbit3:15692"}'
        values: "1 1 1 1 1 1"
    alert_rule_test:
      - eval_time: 25s
        alertname: RabbitMQQuorumLost
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "RabbitMQ majority lost"
              description: "Fewer than 2 of 3 nodes are up. Publishes will not be confirmed until a second node is back."

  # 3. Raft term increases on a queue (new leader elected) -> info alert.
  - interval: 5s
    input_series:
      - series: 'rabbitmq_detailed_raft_term_total{instance="rabbit2:15692",vhost="/",queue="hw2.orders"}'
        values: "5 5 5 6 6 6"
      - series: 'rabbitmq_detailed_raft_term_total{instance="rabbit3:15692",vhost="/",queue="hw2.orders"}'
        values: "5 5 5 6 6 6"
    alert_rule_test:
      - eval_time: 25s
        alertname: RabbitMQRaftLeaderElection
        exp_alerts:
          - exp_labels: {severity: info, vhost: "/", queue: hw2.orders}
            exp_annotations:
              summary: "Raft leader election on hw2.orders"
              description: "The Raft term of hw2.orders changed in the last minute (a new leader was elected)."

  # 4. Messages waiting, no consumers for > 1 min.
  - interval: 15s
    input_series:
      - series: 'rabbitmq_detailed_queue_messages{instance="rabbit1:15692",vhost="/",queue="hw2.orders"}'
        values: "500x10"
      - series: 'rabbitmq_detailed_queue_consumers{instance="rabbit1:15692",vhost="/",queue="hw2.orders"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 90s
        alertname: RabbitMQNoConsumers
        exp_alerts:
          - exp_labels: {severity: warning, vhost: "/", queue: hw2.orders}
            exp_annotations:
              summary: "hw2.orders has messages but no consumers"
              description: "Messages are waiting and nobody is subscribed."
