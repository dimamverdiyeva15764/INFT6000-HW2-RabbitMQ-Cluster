# Grafana datasource - owner: P2. Loaded automatically at Grafana start-up.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus            # fixed uid, referenced by every dashboard JSON
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s         # = Prometheus scrape_interval
